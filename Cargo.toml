[package]
name = "cnipix"
version = "0.1.0"
edition = "2021"
description = "A browser-based palette pixel animation editor"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "HtmlElement", "KeyboardEvent", "PointerEvent"] }

